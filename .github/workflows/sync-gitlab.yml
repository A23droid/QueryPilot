name: Sync to GitLab

on:
  push:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Push to GitLab
        env:
          GITLAB_HOST: ${{ secrets.GITLAB_HOST }}
          GITLAB_USERNAME: ${{ secrets.GITLAB_USERNAME }}
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          git clone --bare \
            "https://github.com/${{ github.repository }}.git" repo.git
          cd repo.git
          git push --mirror \
            "https://${GITLAB_USERNAME}:${GITLAB_TOKEN}@${GITLAB_HOST#https://}/idk-group9212743/QueryPilot.git"
